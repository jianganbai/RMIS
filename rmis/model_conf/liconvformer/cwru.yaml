# data
sample_rate: 12000
feat_type: wav  # wav input, no spectrogram

# preprocess
norm: False

# model
model_name: liconvformer
model_conf:
  ckpt: LiConvFormer/cwru_best.pt
  in_channel: 1
  drop: 0.1
  dim: 32

# inference
batch_size: 16
test_batch_size: 16

# dataset specific sample rates
ds_spcf:
  idmt_air:
    sample_rate: 48000
  idmt_engine:
    sample_rate: 44100
  wt_plane_gearbox:
    sample_rate: 48000
  mafaulda_sound:
    sample_rate: 50000
  mafaulda_vib:
    sample_rate: 50000
  sdust_bearing:
    sample_rate: 25600
  sdust_gear:
    sample_rate: 25600
  umged_microphone:
    sample_rate: 51200
  umged_vib:
    sample_rate: 51200
  umged_vol:
    sample_rate: 51200
  umged_cur:
    sample_rate: 51200
  pu_vib:
    sample_rate: 64000
  pu_cur:
    sample_rate: 64000
